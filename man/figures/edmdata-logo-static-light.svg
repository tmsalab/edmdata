<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 600" width="520" height="600" role="img" aria-labelledby="edmdatalTitle edmdatalDesc">
<title id="edmdatalTitle">edmdata</title>
<desc id="edmdatalDesc">Hexagonal logo for the R package edmdata: a solid database cylinder, the usual symbol for stored data, seen from slightly above. Its front is divided by thin curved seams into three platters, one for each kind of data set the package ships, each as tall as its share of the 31: the tallest, top platter carries the word edmdata cut out of it, and the two below are plain. Above the stack floats an orange disc, drawn at display size rather than to the platters' scale: a copy of one data set being loaded, while all 31 stay in the package. Ten small square cells are cut out of its edge, solid or empty: the first examinee's answers to the first ten items of the fraction subtraction test, a solid cell for a correct answer. A faint dot grid fills the plate around the drawing.</desc>
